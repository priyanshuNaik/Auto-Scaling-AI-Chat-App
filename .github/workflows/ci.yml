name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/ai-chat-app

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Scan & Code Quality

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort bandit

    - name: Bandit Security Scan
      run: bandit -r app/ -ll || true

    - name: Run flake8
      run: flake8 app/

    - name: Check formatting with black
      run: black --check app/

  test:
    runs-on: ubuntu-latest
    needs: scan
    name: Unit Tests

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        export PYTHONPATH=$(pwd)
        pytest app/tests/ -v --cov=app --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittest

  build-and-push:
    runs-on: ubuntu-latest
    needs: [scan, test]
    name: Build & Push to DockerHub
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract and upload coverage from image
      run: |
        docker create --name temp ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker cp temp:/app/coverage.xml ./coverage.xml || true
        docker rm temp

    - name: Upload final coverage report
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: ./coverage.xml
        flags: docker

    - name: Run Trivy scan on pushed image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        severity: CRITICAL,HIGH
        exit-code: '1'
